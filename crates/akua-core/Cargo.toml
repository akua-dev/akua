[package]
name = "akua-core"
description = "Akua core library: lockfile/manifest parsers, Package.k loader, render output writer, CLI contract primitives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["engine-kcl"]
# KCL engine: native Rust via kcl-lang/lib (git dependency). The render
# worker enables it; the manifest and lockfile parsers build without it.
engine-kcl = ["dep:kcl-lang", "dep:sha2", "dep:tempfile"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
# host_auth uses this for `Authorization: Basic <b64>` header encoding.
base64 = { version = "0.22" }

# The KCL engine. The worker compiles it to wasm32-wasip1; the three
# kcl-lang/kcl crates that need wasm32 fixes are patched in the workspace
# Cargo.toml ([patch] block, third_party/kcl/patches).
kcl-lang = { git = "https://github.com/kcl-lang/lib", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
