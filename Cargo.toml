[workspace]
resolver = "2"
members = [
	"crates/akua-core",
	"crates/akua-render-worker",
]

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/akua-dev/akua"
authors = ["CNAP Tech <hello@cnap.tech>"]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yml", version = "0.0.12" }
toml = "1.0"

# Error handling
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Observability — tracing is the universal emitter (libraries depend on it
# only); tracing-subscriber + the opentelemetry stack live in the host (cli).
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "ansi", "registry"] }
tracing-opentelemetry = "0.27"
opentelemetry = "0.26"
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio-current-thread"] }
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic"] }

# kcl-lang (crates/akua-core's engine-kcl dependency, from
# https://github.com/kcl-lang/lib) declares every kcl-* crate as a
# plain `git = "https://github.com/kcl-lang/kcl"` dependency with no
# rev/branch - Cargo pins the resolved commit in the committed
# Cargo.lock, refreshed only by an explicit `cargo update`. That's
# reproducible on its own; a same-URL `[patch]` entry with just an
# added `rev` is not accepted by Cargo ("patches must point to
# different sources"), so most kcl-* crates need no patch entry here
# at all. Three crates still need a real wasm32 fix upstream hasn't
# landed yet, patched locally instead of via the old akua-dev/kcl
# fork: kcl-parser (WASI preopen probing), kcl-language-server (wasm32
# Url::from_file_path shim), kcl-runtime (wasm32-unknown-unknown
# plugin stub). Patches live as a numbered series in
# third_party/kcl/patches/, applied and vendored under
# third_party/kcl/vendor/ - see that README for the per-patch
# rationale, upstream PR status, remove-when condition, and the exact
# pinned upstream commit. Never reference the akua-dev/kcl fork from
# this repo again.
[patch."https://github.com/kcl-lang/kcl"]
kcl-language-server = { path = "third_party/kcl/vendor/kcl-language-server" }
kcl-parser = { path = "third_party/kcl/vendor/kcl-parser" }
kcl-runtime = { path = "third_party/kcl/vendor/kcl-runtime" }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.ci-release]
inherits = "release"
lto = false
codegen-units = 16
strip = "symbols"
debug = "line-tables-only"
incremental = false
