<h1>E_MANIFEST_GIT_USERINFO</h1>
<p>A git dependency URL embeds credentials (a user:password@ part before the host). It is rejected so the secret never reaches the lockfile or git history; pass credentials with --auth or --auth-file instead.</p>
<p><a href="https://docs.akua.dev/akua/errors/E_MANIFEST_GIT_USERINFO">https://docs.akua.dev/akua/errors/E_MANIFEST_GIT_USERINFO</a></p>
