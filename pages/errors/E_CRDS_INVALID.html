<h1>E_CRDS_INVALID</h1>
<p>A CRD dependency yields no typed schemas: its crds path names nothing in the source, the files under it hold no CustomResourceDefinition, a CRD is malformed, or two files define the same kind and version differently.</p>
<p><a href="https://docs.akua.dev/akua/errors/E_CRDS_INVALID">https://docs.akua.dev/akua/errors/E_CRDS_INVALID</a></p>
