name: CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# The akua CLI lives in packages/cli/; `bun install` at the root links @akua-dev/sdk.
defaults:
  run:
    working-directory: packages/cli

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check

  smoke-matrix:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.release-matrix.outputs.matrix }}
      version: ${{ steps.release-matrix.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Derive native smoke matrix and version
        id: release-matrix
        shell: bash
        run: |
          echo "matrix=$(bun scripts/release.ts matrix)" >> "$GITHUB_OUTPUT"
          echo "version=$(bun -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  install-smoke:
    needs: smoke-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.smoke-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Download, verify, and smoke published ${{ matrix.target }}
        id: release-smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.smoke-matrix.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          archive="akua-v$VERSION-$TARGET.tar.gz"
          if [ "$TARGET" = windows-x64 ]; then archive="akua-v$VERSION-$TARGET.zip"; fi
          gh release download "v$VERSION" --repo akua-dev/akua --pattern "$archive" --pattern "$archive.sha256" --dir dist/release
          read -r archive_sha _ < "dist/release/$archive.sha256"
          bun scripts/release.ts smoke --version "$VERSION" --output dist/release --target "$TARGET" --archive-sha256 "$archive_sha"
