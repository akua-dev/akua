name: CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The akua CLI lives in cli/; `bun install` at the root links @akua-dev/sdk.
defaults:
  run:
    working-directory: cli

# Release builds (cnap Bazel) embed the package toolchain for `akua pkg`.
# These source builds run the published akuapkg executable from PATH instead.
env:
  AKUAPKG_VERSION: 0.9.6

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check

  package-release:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.release-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --os='*' --cpu='*'
      - name: Derive native smoke matrix
        id: release-matrix
        shell: bash
        run: echo "matrix=$(bun scripts/release.ts matrix)" >> "$GITHUB_OUTPUT"
      - name: Build and verify all release artifacts
        run: |
          version="$(bun -p "require('./package.json').version")"
          bun scripts/release.ts package --version "$version" --output dist/release --akuapkg-version "$AKUAPKG_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: akua-release-candidate
          path: cli/dist/release/
          if-no-files-found: error

  install-smoke:
    needs: package-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package-release.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: akua-release-candidate
          path: cli/dist/release
      - name: Put akuapkg ${{ env.AKUAPKG_VERSION }} on PATH
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ matrix.target }}" in
            darwin-arm64) triple=aarch64-apple-darwin ;;
            darwin-x64) triple=x86_64-apple-darwin ;;
            linux-arm64) triple=aarch64-unknown-linux-gnu ;;
            linux-x64) triple=x86_64-unknown-linux-gnu ;;
            windows-x64) triple=x86_64-pc-windows-msvc ;;
          esac
          dir="$RUNNER_TEMP/akuapkg"
          gh release download "v$AKUAPKG_VERSION" -R akua-dev/akua -p "akuapkg-v$AKUAPKG_VERSION-$triple.*" -D "$dir"
          archive="$(ls "$dir"/akuapkg-v*-"$triple".{tar.gz,zip} 2>/dev/null | head -1)"
          (cd "$dir" && sha256sum -c "$(basename "$archive").sha256")
          case "$archive" in *.zip) unzip -q "$archive" -d "$dir" ;; *) tar -xzf "$archive" -C "$dir" ;; esac
          echo "$dir" >> "$GITHUB_PATH"
      - name: Extract, install, and smoke ${{ matrix.target }}
        shell: bash
        run: |
          version="$(bun -p "require('./package.json').version")"
          archive_sha="$(bun -e 'const m = await Bun.file(process.argv[1]).json(); console.log(m.assets.find(a => a.target === process.argv[2]).sha256)' "dist/release/akua-v$version-manifest.json" "${{ matrix.target }}")"
          bun scripts/release.ts smoke --version "$version" --output dist/release --target "${{ matrix.target }}" --archive-sha256 "$archive_sha"
