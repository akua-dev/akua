name: pages

# Publishes cli.akua.dev: the install scripts, and forwarding pages to the
# akua pkg documentation on docs.akua.dev. Every structured error's `docs`
# link is https://cli.akua.dev/errors/<CODE>, served from pages/errors/.
#
#   pages/**             -> /                (generated; never edit by hand)
#   scripts/install.sh   -> /install         (curl -fsSL https://cli.akua.dev/install | sh)
#   scripts/install.ps1  -> /install.ps1
#
# pages/ is generated in the canonical repository from the CLI's error
# catalog (`bazel run //:write_akua_reference_docs`), so this job only copies.

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Assemble site
        run: |
          set -eu
          mkdir -p _site
          cp -R pages/. _site/
          cp scripts/install.sh _site/install
          cp scripts/install.ps1 _site/install.ps1
          for page in index.html 404.html errors/index.html errors/E_IO.html install install.ps1; do
            test -s "_site/$page"
          done

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
