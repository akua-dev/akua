name: release

# Builds the `akuapkg` release: per-platform CLI binaries, the immutable
# GitHub Release, and the `ghcr.io/akua-dev/akuapkg` container image.
# Triggered by `v<semver>` tag pushes.
#
# Job graph:
#
#   detect-version ─┬─> wasm-bundle ─> cli-build ─┬─> github-release
#                   │                              └─> docker
#                   └─ (version + is_prerelease propagated to every job)
#
# npm packages are no longer published from this pipeline (akua-dev/cnap#2348):
# `@akua-dev/sdk` is consumed directly inside the akua-dev/cnap monorepo, and
# the `@akua-dev/native*` napi packages were only ever npm-publish plumbing.
# See docs/releasing.md for the recovery dispatch shape that remains.
#
# `wasm-bundle` builds the embedded engines once and `cli-build` downloads
# the same bytes — was rebuilt per matrix job before, ~5-10 min saved per
# release.
#
# Prerelease handling: tags containing `-` (e.g. `v0.8.7-rc1`) are marked as
# prereleases on GitHub Releases and skip the `:latest` Docker tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Skip every actual publish; build + pack only'
        type: boolean
        default: true
      tag:
        description: 'Tag name (e.g. v0.8.7) — required for manual runs'
        required: true
      expected-source-commit:
        description: 'Reviewed commit the tag must resolve to — required for manual runs'
        required: true
        type: string
      expected-workflow-commit:
        description: 'Reviewed commit containing this workflow — required for manual runs'
        required: true
        type: string
      create-missing-release:
        description: 'Create the immutable GitHub Release if the tag failed before release creation'
        type: boolean
        default: false
        required: true

permissions:
  contents: write   # github-release: create Releases
  packages: write   # docker: push to ghcr.io

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # detect-version — single source of truth for tag-derived strings.
  # Other jobs reference these outputs instead of re-parsing GITHUB_REF_NAME,
  # which avoids tag-prefix drift and keeps prerelease detection in one
  # place (the only spot a typo here would surface).
  # ---------------------------------------------------------------------------
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      source_commit: ${{ steps.parse.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected-source-commit }}
          EXPECTED_WORKFLOW_COMMIT: ${{ inputs.expected-workflow-commit }}
          ACTUAL_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' is not a valid semver v* tag"
            exit 1
          fi
          source_commit=$(git rev-parse "refs/tags/${tag}^{commit}")
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::expected source commit is not a full lowercase SHA"
              exit 1
            fi
            if [[ ! "$EXPECTED_WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::expected workflow commit is not a full lowercase SHA"
              exit 1
            fi
            if [[ "$source_commit" != "$EXPECTED_SOURCE_COMMIT" ]]; then
              echo "::error::$tag resolves to $source_commit, expected $EXPECTED_SOURCE_COMMIT"
              exit 1
            fi
            if [[ "$ACTUAL_WORKFLOW_COMMIT" != "$EXPECTED_WORKFLOW_COMMIT" ]]; then
              echo "::error::workflow commit $ACTUAL_WORKFLOW_COMMIT does not match expected $EXPECTED_WORKFLOW_COMMIT"
              exit 1
            fi
          fi
          head_commit=$(git rev-parse 'HEAD^{commit}')
          if [[ "$head_commit" != "$source_commit" ]]; then
            echo "::error::checkout $head_commit does not match $tag at $source_commit"
            exit 1
          fi
          version="${tag#v}"
          # Semver prerelease has a `-` separator after the patch number
          # (1.2.3-rc1, 1.2.3-alpha.4). A bare `v1.2.3` doesn't match.
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "is_prerelease=$is_prerelease"
            echo "source_commit=$source_commit"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$tag commit=$source_commit version=$version prerelease=$is_prerelease"

  # ---------------------------------------------------------------------------
  # wasm-bundle — engine + render-worker wasm artefacts built once on
  # Linux. wasm32-wasip1 is byte-deterministic across runners, so the
  # native + cli matrix jobs each download the same bytes instead of
  # rebuilding them — saves ~5-10 min per matrix runner and unblocks
  # the Windows runner (the helm fork's apply.sh is bash, can't run on
  # Windows natively).
  # ---------------------------------------------------------------------------
  wasm-bundle:
    runs-on: ubuntu-latest
    needs: detect-version
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-version.outputs.source_commit }}

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - uses: rui314/setup-mold@v1

      - name: Install wasm32-wasip1 target
        run: mise exec -- rustup target add wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-bundle
          cache-on-failure: true

      # Mirror the cache shape ci.yml uses — same content-addressed
      # keys mean this job inherits hits from main-branch CI runs and
      # skips redundant Go compiles.
      - name: Restore helm engine wasm cache
        uses: actions/cache@v5
        with:
          path: crates/helm-engine-wasm/assets/helm-engine.wasm
          key: helm-engine-${{ runner.os }}-${{ hashFiles('.mise.toml', 'crates/helm-engine-wasm/go-src/**', 'crates/helm-engine-wasm/fork/**') }}

      - name: Restore kustomize engine wasm cache
        uses: actions/cache@v5
        with:
          path: crates/kustomize-engine-wasm/assets/kustomize-engine.wasm
          key: kustomize-engine-${{ runner.os }}-${{ hashFiles('.mise.toml', 'crates/kustomize-engine-wasm/go-src/**') }}

      - name: Cache Go module + build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('.mise.toml', '**/go.mod') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Cache helm fork tree
        uses: actions/cache@v5
        with:
          path: crates/helm-engine-wasm/third_party/helm-fork
          key: helm-fork-${{ runner.os }}-${{ hashFiles('crates/helm-engine-wasm/fork/**') }}

      - name: Build embedded engines (Go → wasip1)
        run: mise exec -- task build:engines

      - name: Build embedded render-worker (Rust → wasip1)
        run: mise exec -- task build:render-worker

      - name: Upload wasm bundle
        uses: actions/upload-artifact@v4
        with:
          name: wasm-bundle
          path: |
            crates/helm-engine-wasm/assets/helm-engine.wasm
            crates/kustomize-engine-wasm/assets/kustomize-engine.wasm
            target/wasm32-wasip1/release/akua-render-worker.wasm
            target/wasm32-wasip1/release/akua-render-worker.wasm.sources.sha256
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # cli-build — per-platform `akuapkg` binary matrix. Downloads the wasm
  # bundle built above, packages tarballs + sha256 sidecars.
  # ---------------------------------------------------------------------------
  cli-build:
    needs: [detect-version, wasm-bundle]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-version.outputs.source_commit }}

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # mold — dramatically faster link on Linux. No-op on macOS. Rust
      # 1.90 ships rust-lld as default on x86_64-linux-gnu (mold still
      # edges it); aarch64-linux-gnu still benefits substantially.
      - if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      # `~/.cargo/{registry,git}` + `target/` cache. Without this, every
      # tag push repaid the full cold-compile cost (~6 min each for
      # heavy git deps like kcl-lang). With it, warm runs collapse to
      # link-only time (~1-2 min). One cache per target so the 5 matrix
      # jobs don't stomp each other under the 10 GB per-repo limit.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
          cache-all-crates: true

      - name: Install Linux arm64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Cross-compile for linux/arm64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          aarch64-linux-gnu-gcc --version
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"

      - name: Rust target
        run: mise exec -- rustup target add ${{ matrix.target }}

      # The git tag is the single source of truth for the version. Inject it
      # into the Rust workspace so the binary's CARGO_PKG_VERSION (akua -V,
      # SLSA provenance, OCI annotations, user-agent) matches the tag it
      # ships under — the committed Cargo.toml value is only a dev placeholder.
      - name: Set Cargo version from the tag
        shell: bash
        run: ./scripts/set-cargo-version.sh "${{ needs.detect-version.outputs.version }}"

      # Pull the wasm bundle the wasm-bundle job built. Bytes land at
      # their original paths under the workspace root — exactly where
      # akuapkg-cli/build.rs + helm-engine-wasm/build.rs +
      # kustomize-engine-wasm/build.rs look for them. The matrix runner's
      # build.rs precompiles each .wasm into a target-arch cwasm via
      # wasmtime AOT.
      - name: Download wasm bundle
        uses: actions/download-artifact@v4
        with:
          name: wasm-bundle
          path: .

      - name: Build Akuapkg CLI
        # `ci-release` profile: lto off, codegen-units=16, symbols
        # stripped, line-tables-only debug. Trades ~5-10% runtime perf
        # for ~25-40% compile-time reduction. See Cargo.toml.
        run: mise exec -- cargo build -p akuapkg-cli --profile ci-release --target ${{ matrix.target }}

      # Smoke-test the binary the way an end-user would: `akuapkg init` +
      # `akuapkg render` against the scaffolded Package. Catches any future
      # "binary ships without a worker" / wrong-arch cwasm regression
      # before users see it. Skipped on cross-compiled targets where the
      # runner can't execute the output.
      - name: Smoke-test the built binary
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -eu
          bin="$PWD/target/${{ matrix.target }}/ci-release/akuapkg"
          # Guard: the binary must report the tag it ships under. Catches a
          # regression in the version-injection step before users see a
          # release whose `akuapkg -V` disagrees with its tag.
          expected="${{ needs.detect-version.outputs.version }}"
          got="$("$bin" -V | awk '{print $NF}')"
          if [ "$got" != "$expected" ]; then
            echo "version mismatch: binary reports '$got', tag is '$expected'" >&2
            exit 1
          fi
          echo "version ok: akuapkg -V == $expected"
          tmp=$(mktemp -d)
          cd "$tmp"
          "$bin" init smoke
          cd smoke
          "$bin" render
          test -d ./deploy
          test -n "$(ls ./deploy)"
          echo "smoke ok: $(ls ./deploy)"

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="akuapkg-${{ needs.detect-version.outputs.tag }}-${{ matrix.target }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/ci-release/akuapkg dist/
          cp README.md SECURITY.md LICENSE dist/ 2>/dev/null || true
          cd dist && tar -czf "${name}.tar.gz" akuapkg README.md SECURITY.md LICENSE
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "akuapkg-${{ needs.detect-version.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/ci-release/akuapkg.exe" -Destination dist/
          Copy-Item README.md,SECURITY.md,LICENSE -Destination dist/ -ErrorAction SilentlyContinue
          Push-Location dist
          7z a "$name.zip" akuapkg.exe README.md SECURITY.md LICENSE
          (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          Pop-Location

      - uses: actions/upload-artifact@v7
        with:
          name: akuapkg-${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/*.zip*

  # ---------------------------------------------------------------------------
  # github-release — creates per-target Release assets on a new tag push.
  # Manual recovery verifies an existing immutable Release by default. An
  # explicit opt-in may create a Release that the original tag run never
  # reached; neither path replaces assets on an existing Release.
  # Prerelease tags surface the "Pre-release" badge so
  # `gh release view --latest` skips them.
  # ---------------------------------------------------------------------------
  github-release:
    needs: [detect-version, cli-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry-run == false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-version.outputs.source_commit }}
      - uses: actions/download-artifact@v8
        with:
          # Filter to the cli-build artifacts this job consumes —
          # `akuapkg-<target>` per-platform tarballs + sha256 sidecars
          # (uploaded as `name: akuapkg-${{ matrix.target }}` upstream).
          # Without the pattern, download-artifact also pulls the
          # docker job's `akua-dev~akua~<id>.dockerbuild` provenance
          # artifact whose `~`-containing name fails path validation
          # in v4 (and only silently slips by on v8 because the
          # merge-multiple flag tolerates it; defensive here so a
          # v8 → v4 downgrade doesn't bring back the bug).
          pattern: 'akuapkg-*'
          path: dist
          merge-multiple: true
      - name: Create or verify immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.detect-version.outputs.tag }}
          VERSION: ${{ needs.detect-version.outputs.version }}
          SOURCE_COMMIT: ${{ needs.detect-version.outputs.source_commit }}
          IS_PRERELEASE: ${{ needs.detect-version.outputs.is_prerelease }}
          CREATE_MISSING_RELEASE: ${{ inputs['create-missing-release'] }}
        run: |
          set -eu
          notes="See [CHANGELOG.md](https://github.com/akua-dev/akuapkg/blob/main/CHANGELOG.md) for details."
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if gh release view "${TAG}" --repo "${GH_REPO}" > /dev/null 2>&1; then
              echo "Verified existing immutable Release ${TAG}; recovery does not upload or replace assets."
              exit 0
            fi
            if [[ "$CREATE_MISSING_RELEASE" != "true" ]]; then
              echo "::error::Release ${TAG} does not exist; set create-missing-release=true only for a reviewed pre-Release failure recovery"
              exit 1
            fi
            echo "Release ${TAG} is missing; explicit SHA-bound recovery authorized its creation."
          fi
          flags=()
          if [ "${IS_PRERELEASE}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" \
            --repo "${GH_REPO}" \
            --verify-tag \
            --target "${SOURCE_COMMIT}" \
            --title "Akuapkg ${VERSION}" \
            --notes "${notes}" \
            "${flags[@]}" \
            dist/*.tar.gz dist/*.zip dist/*.sha256

  # ---------------------------------------------------------------------------
  # docker — multi-arch image at `ghcr.io/akua-dev/akuapkg:<tag>`. Skips
  # the `:latest` tag for prereleases so `docker pull akuapkg:latest`
  # stays on the most recent stable release.
  # ---------------------------------------------------------------------------
  docker:
    needs: [detect-version, cli-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry-run == false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect-version.outputs.source_commit }}
      - uses: actions/download-artifact@v8
        with:
          pattern: 'akuapkg-*'
          path: dist
          merge-multiple: true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Linux binaries for the image
        # Pull the prebuilt binaries out of the release tarballs we just
        # built — avoids a separate compile-in-Docker step and keeps the
        # image contents byte-identical to the GitHub Release.
        run: |
          set -eu
          mkdir -p image-context/amd64 image-context/arm64
          tag="${{ needs.detect-version.outputs.tag }}"
          tar -xzf "dist/akuapkg-${tag}-x86_64-unknown-linux-gnu.tar.gz" -C image-context/amd64 akuapkg
          tar -xzf "dist/akuapkg-${tag}-aarch64-unknown-linux-gnu.tar.gz" -C image-context/arm64 akuapkg
      - name: Compute image tags
        id: tags
        run: |
          set -eu
          tag="${{ needs.detect-version.outputs.tag }}"
          # Versioned tag always; `:latest` only for stable releases.
          tags="ghcr.io/akua-dev/akuapkg:${tag}"
          if [ "${{ needs.detect-version.outputs.is_prerelease }}" = "false" ]; then
            tags="${tags}
          ghcr.io/akua-dev/akuapkg:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build + push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: image-context
          file: scripts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
