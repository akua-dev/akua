[package]
name    = "10-kcl-ecosystem"
version = "0.1.0"
edition = "akua.dev/v1alpha1"
# kpm-published artifacts under `ghcr.io/kcl-lang/*` are not cosign-
# signed. strict_signing is off by default without a [signing] key; the
# explicit `false` keeps `verify` passing even if a key is added later.
strict_signing = false

[dependencies]
# The `kcl-lang/k8s` module: typed schemas for one Kubernetes release,
# pinned by digest in akua.lock and imported as
# `import k8s.api.<group>.<version>` in package.k. The first render pulls
# it from ghcr.io; later renders use the cache.
k8s = { oci = "oci://ghcr.io/kcl-lang/k8s", version = "1.31.2" }
