# Use the system `git` for fetching, not libgit2. Required for SSH
# auth on deps + patches hosted on github.com (including our own
# cnap-tech/kcl fork pinned via the [patch] block in workspace
# Cargo.toml).
[net]
git-fetch-with-cli = true

# The render worker's KCL runtime calls the host plugin bridge
# (kcl_plugin_invoke_json_wasm) through a plain extern, so it must stay an
# import of the worker module. Rust 1.96+ no longer links wasm targets with
# --allow-undefined by default.
[target.wasm32-wasip1]
rustflags = ["-C", "link-arg=--allow-undefined"]
