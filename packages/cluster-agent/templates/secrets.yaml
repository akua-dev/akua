{{- $ns := include "akua.namespace" . -}}
{{- /*
akua-agent-identity, akua-tunnel-connector, akua-agent-bundle and akua-updater-bundle are created empty, with no
data or stringData key. The agent's Role may only get, update and patch them
(RBAC cannot restrict "create" by resource name, so the agent cannot create
them), hence the chart creates them. akua-agent-bundle is the updater's: the
last good agent bundle it rolls back to. akua-updater-bundle is the agent's:
the last good updater objects it rolls back to. Helm's three-way merge never touches a
key the chart does not declare, so the key the agent writes survives every
`helm upgrade`. helm.sh/resource-policy: keep leaves them in place on
`helm uninstall`, so a reinstall keeps the cluster's identity.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: akua-agent-identity
  namespace: {{ $ns }}
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: akua-tunnel-connector
  namespace: {{ $ns }}
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: akua-agent-bundle
  namespace: {{ $ns }}
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "updater") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: akua-updater-bundle
  namespace: {{ $ns }}
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if and (eq .Values.enrollment.method "code") .Values.enrollment.code }}
---
apiVersion: v1
kind: Secret
metadata:
  name: akua-agent-enrollment
  namespace: {{ $ns }}
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
type: Opaque
stringData:
  code: {{ .Values.enrollment.code | quote }}
{{- end }}
