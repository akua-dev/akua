{{- $ns := include "akua.namespace" . -}}
{{- include "akua.access" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akua-agent
  namespace: {{ $ns }}
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akua-apply
  namespace: {{ $ns }}
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akua-agent-updater
  namespace: {{ $ns }}
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "updater") | nindent 4 }}
automountServiceAccountToken: true
