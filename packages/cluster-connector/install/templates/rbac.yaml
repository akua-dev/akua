{{- $ns := include "akua.namespace" . -}}
# These rules are the contract objects agentClusterRole, agentRole,
# updaterClusterRole and updaterRole in packages/cluster-agent/src/contract.ts.
# Change both together.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: akua-agent
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: akua-agent
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: akua-agent
subjects:
  - kind: ServiceAccount
    name: akua-agent
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: akua-agent
  namespace: {{ $ns }}
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["akua-apply"]
    verbs: ["impersonate"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["akua-agent-identity", "akua-tunnel-connector", "akua-updater-bundle"]
    verbs: ["get", "update", "patch"]
  # The updater's state: the agent applies the updater's objects only while it is idle.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["akua-agent-bundle"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: akua-agent
  namespace: {{ $ns }}
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "agent") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: akua-agent
subjects:
  - kind: ServiceAccount
    name: akua-agent
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: akua-agent-updater
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "updater") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: akua-agent-updater
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "updater") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: akua-agent-updater
subjects:
  - kind: ServiceAccount
    name: akua-agent-updater
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: akua-agent-updater
  namespace: {{ $ns }}
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "updater") | nindent 4 }}
rules:
  # The agent bundle is applied as akua-apply, so the customer's grant decides.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["akua-apply"]
    verbs: ["impersonate"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["akua-agent"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # akua-updater-bundle is the agent's state: no agent update while it applies the updater.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["akua-agent-identity", "akua-updater-bundle"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["akua-agent-bundle"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: akua-agent-updater
  namespace: {{ $ns }}
  labels:
    {{- include "akua.componentLabels" (dict "root" . "component" "updater") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: akua-agent-updater
subjects:
  - kind: ServiceAccount
    name: akua-agent-updater
    namespace: {{ $ns }}
